name: pikuru
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: 4.4.0
  cloud_firestore: ^6.1.2
  firebase_auth: ^6.1.4
  modal_progress_hud_nsn: ^0.5.0
  google_sign_in: ^6.1.5
  shared_preferences: ^2.2.2
  app_links: ^3.1.0
  cloud_functions: ^6.0.6
  flutter_riverpod: ^2.4.0
  google_maps_flutter: ^2.5.0
  url_launcher: ^6.2.0
  intl: ^0.19.0
  image_picker: ^1.1.2
  image: ^4.1.7
  http: ^1.2.0
  geocoding: ^3.0.0
  geolocator: ^11.0.0
  firebase_storage: ^13.0.6
  sign_in_with_apple: ^6.1.4
  crypto: ^3.0.3
  firebase_messaging: ^16.1.1
  flutter_local_notifications: ^17.2.4

dev_dependencies:
  flutter_launcher_icons: ^0.13.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/pikuru_full_logo.png"
  min_sdk_android: 21
  web:
    generate: false

flutter:
  uses-material-design: true

  assets:
    - assets/register_pickleball.png
    - assets/pikuru_full_logo.png
    - assets/pikuru_logo.png
    - assets/pikuru_logo_dog.png
    - assets/icon/pikuru_full_logo.png

  fonts:
    - family: Rubik
      fonts:
        - asset: assets/fonts/Rubik-Regular.ttf
        - asset: assets/fonts/Rubik-Medium.ttf
          weight: 500